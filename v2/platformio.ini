; ============================================================================
;  D.E.V_Darshan v2.0 — PlatformIO Configuration (ESP32-S3 Super Mini)
; ============================================================================
;  Supports Native USB CDC Serial Monitor, 0.91" I2C OLED, 4 Tactile Buttons,
;  and LittleFS Flash filesystem.
; ============================================================================

[platformio]
default_envs = esp32s3_supermini

[env:esp32s3_supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Flash & PSRAM Configuration (4MB Flash DIO, Quad PSRAM)
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = dio_qspi

; Native USB CDC + PSRAM enabled
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1

; Filesystem partition (allocates space for LittleFS storage)
board_build.filesystem = littlefs

; Libraries needed for v2
lib_deps =
    olikraus/U8g2 @ ^2.35.19

