; ============================================================================
;  D.E.V_Darshan v2.0 — PlatformIO Configuration (ESP32-S3 Super Mini)
; ============================================================================
;  Supports Native USB CDC Serial Monitor, 0.91" I2C OLED, 4 Tactile Buttons,
;  and LittleFS Flash filesystem.
; ============================================================================

[platformio]
default_envs = esp32s3_supermini

[env:esp32s3_supermini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Native USB CDC configuration: enables Serial.print via built-in USB-C port
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

; Flash Configuration (Standard for ESP32-S3 Super Mini: 4MB or 8MB QIO 80MHz)
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Filesystem partition (allocates space for LittleFS storage)
board_build.filesystem = littlefs

; Libraries needed for v2
lib_deps =
    olikraus/U8g2 @ ^2.35.19

; ----------------------------------------------------------------------------
; Optional environment for boards equipped with Octal/Quad PSRAM
; ----------------------------------------------------------------------------
[env:esp32s3_supermini_with_psram]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=1

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi

lib_deps =
    olikraus/U8g2 @ ^2.35.19
